name: Sausage Store Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: ${{ secrets.SAUSAGE_STORE_NAMESPACE }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  HELM_CHART_DIR: sausage-store-chart
  HELM_CHART_NAME: sausage-store

jobs:
  # Сборка и пуш образов в Docker Hub
  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Backend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          platforms: linux/amd64
          tags: indeicheg/sausage-backend:latest
          build-args: |
            VERSION=${{ github.sha }}

      - name: Push Frontend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          platforms: linux/amd64
          tags: indeicheg/sausage-frontend:latest

      - name: Push Backend-report to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend-report/
          push: true
          platforms: linux/amd64
          tags: indeicheg/sausage-backend-report:latest

  # Упаковка helm-чарта и пуш в Nexus
  add_helm_chart_to_nexus:
    name: Add Helm Chart To Nexus
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm dependency update
        run: |
          cd $HELM_CHART_DIR
          helm dependency update

      - name: Package Helm chart
        run: |
          mkdir -p .packages
          helm package $HELM_CHART_DIR -d .packages
          ls -la .packages

      - name: Upload chart to Nexus
        run: |
          CHART_FILE=$(ls .packages/*.tgz | head -1)
          echo "Uploading $CHART_FILE"
          curl -v --fail \
               --user "$NEXUS_HELM_REPO_USER:$NEXUS_HELM_REPO_PASSWORD" \
               --upload-file "$CHART_FILE" \
               "$NEXUS_HELM_REPO/"

  # Деплой приложения в Kubernetes с помощью helm-чарта
  deploy_helm_chart_to_kubernetes:
    name: Deploy Helm Chart To Kubernetes
    runs-on: ubuntu-latest
    needs: add_helm_chart_to_nexus
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Add Nexus Helm repo
        run: |
          helm repo add nexus "$NEXUS_HELM_REPO" \
            --username "$NEXUS_HELM_REPO_USER" \
            --password "$NEXUS_HELM_REPO_PASSWORD"
          helm repo update

      - name: Verify chart is visible
        run: helm search repo nexus/sausage-store --versions

      - name: Deploy chart from Nexus
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: |
          helm upgrade --install $HELM_CHART_NAME nexus/sausage-store \
            --namespace $SAUSAGE_STORE_NAMESPACE \
            --history-max 3 \
            --set-string backend.database.password="$POSTGRES_PASSWORD" \
            --set-string infra.postgresql.password="$POSTGRES_PASSWORD" \
            --set-string infra.mongodb.rootPassword="$MONGO_ROOT_PASSWORD" \
            --set-string backend.mongodb.uri="mongodb://root:$MONGO_ROOT_PASSWORD@mongodb:27017/sausage-store?authSource=admin" \
            --set-string backend-report.env.db="mongodb://root:$MONGO_ROOT_PASSWORD@mongodb:27017/sausage-store?authSource=admin" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl get pods -n $SAUSAGE_STORE_NAMESPACE
          kubectl get svc -n $SAUSAGE_STORE_NAMESPACE
          kubectl get ingress -n $SAUSAGE_STORE_NAMESPACE