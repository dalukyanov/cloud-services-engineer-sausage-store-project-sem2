global:
  environment: production

backend:
  replicas: 1
  image:
    repository: indeicheg/sausage-backend
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  database:
    url: jdbc:postgresql://postgresql:5432/sausage-store
    username: store
    password: ""          # --set-string backend.database.password (POSTGRES_PASSWORD)
  mongodb:
    uri: ""               # --set-string backend.mongodb.uri (собирается из MONGO_ROOT_PASSWORD)
  vault:
    enabled: "false"
  resources:
    requests:
      cpu: 250m
      memory: 300Mi
    limits:
      cpu: 700m
      memory: 600Mi
  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15
  vpa:
    updatePolicy:
      updateMode: "Off"
    resourcePolicy:
      containerPolicies:
        - containerName: "*"
          mode: "Auto"
          controlledResources: ["cpu", "memory"]
          minAllowed:
            cpu: 0m
            memory: 0Mi
          maxAllowed:
            cpu: 200m
            memory: 256Mi

backend-report:
  replicas: 1
  image:
    repository: indeicheg/sausage-backend-report
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  env:
    port: "8080"
    db: ""                # --set-string backend-report.env.db (собирается из MONGO_ROOT_PASSWORD)
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75

frontend:
  replicas: 1
  image:
    repository: indeicheg/sausage-frontend
    tag: latest
    pullPolicy: Always
  service:
    port: 80
  ingress:
    enabled: true
    className: nginx
    host: front-dalukyanov.2sem.students-projects.ru
    tlsSecret: 2sem-students-projects-wildcard-secret
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

infra:
  postgresql:
    image: postgres:16-alpine
    database: sausage-store
    username: store
    password: ""          # --set-string infra.postgresql.password (POSTGRES_PASSWORD)
    storage: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  mongodb:
    image: mongo:7
    rootUsername: root
    rootPassword: ""      # --set-string infra.mongodb.rootPassword (MONGO_ROOT_PASSWORD)
    database: sausage-store
    storage: 1Gi
    resources:
      requests:
        cpu: 150m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 512Mi